  <!-- Note -->
  <text x="480" y="445" text-anchor="middle" fill="#8b949e" font-size="11">Annual storage savings exceed $5,550/year per 1,000 GiB under ZSTD-19 and LZMA-6/9 (from $6,000/yr down to ~$441/yr).</text>
