        <rect x="506" y="80.08000000000001" width="20" height="199.92" rx="2" fill="#2ea043" opacity="0.9"/>
        <text x="493" y="302" text-anchor="middle" fill="#c9d1d9" font-size="11" font-weight="600">ZSTD-19</text>
      
