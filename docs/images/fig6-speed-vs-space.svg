  </g>

  <!-- Note -->
  <text x="480" y="445" text-anchor="middle" fill="#8b949e" font-size="11">ZSTD achieves ultra-fast decompression (1.43–1.98 GB/s), making telemetry immediately searchable upon retrieval.</text>
