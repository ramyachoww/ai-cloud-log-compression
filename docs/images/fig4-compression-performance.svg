        <!-- LZMA-6 -->
        <rect x="632" y="42" width="30" height="238" rx="3" fill="#388bfd" opacity="0.9"/>
        <text x="647" y="36" text-anchor="middle" fill="#79c0ff" font-size="10" font-weight="700">13.6</text>
        <rect x="666" y="154.35000000000002" width="30" height="125.64999999999999" rx="3" fill="#d29922" opacity="0.9"/>
        <text x="681" y="148.35000000000002" text-anchor="middle" fill="#e3b341" font-size="10" font-weight="700">7.18</text>
        <text x="664" y="302" text-anchor="middle" fill="#c9d1d9" font-size="11" font-weight="600">LZMA-6</text>
      
        <!-- LZMA-9 -->
        <rect x="718" y="42" width="30" height="238" rx="3" fill="#388bfd" opacity="0.9"/>
        <text x="733" y="36" text-anchor="middle" fill="#79c0ff" font-size="10" font-weight="700">13.6</text>
        <rect x="752" y="154.35000000000002" width="30" height="125.64999999999999" rx="3" fill="#d29922" opacity="0.9"/>
        <text x="767" y="148.35000000000002" text-anchor="middle" fill="#e3b341" font-size="10" font-weight="700">7.18</text>
        <text x="750" y="302" text-anchor="middle" fill="#c9d1d9" font-size="11" font-weight="600">LZMA-9</text>
      
  </g>

  <!-- Subtitle note -->
  <text x="480" y="445" text-anchor="middle" fill="#8b949e" font-size="11">ZSTD-3 matches GZIP-9 in ratio (~9.96 vs ~9.99) while achieving 13.6× faster throughput (548 MB/s vs 40.4 MB/s).</text>
</svg>