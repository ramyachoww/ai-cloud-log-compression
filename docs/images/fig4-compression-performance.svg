        <text x="389" y="64.69999999999999" text-anchor="middle" fill="#79c0ff" font-size="10" font-weight="700">11.96</text>
        <rect x="408" y="163.625" width="30" height="116.375" rx="3" fill="#d29922" opacity="0.9"/>
